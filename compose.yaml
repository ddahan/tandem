# Tandem, the app you use: `./td start` (or `docker compose up -d --build`), then
# http://localhost:3864. Settings come from .env (copy .env.example).
name: tandem

services:
  app:
    build: .
    image: tandem
    restart: unless-stopped
    init: true
    ports:
      # Local only: there is no authentication.
      - '127.0.0.1:${TANDEM_PORT:-3864}:3864'
    environment:
      TANDEM_WATCH_POLLING: ${TANDEM_WATCH_POLLING:-false}
      # A first page to play with, in a notes folder that never had notes.
      TANDEM_WELCOME: 'true'
    volumes:
      # Your notes (Markdown files, attachments, history): typically a OneDrive folder.
      - ${TANDEM_DATA_DIR:?Set TANDEM_DATA_DIR in .env (see .env.example)}:/data
      # The live database, outside the synced folder (a backup is kept in the data folder).
      - db:/var/lib/tandem

volumes:
  db:
