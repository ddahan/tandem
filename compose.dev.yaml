# Everything Docker runs in development. There is no Node on the Mac: `./td` runs pnpm in the
# `node` toolchain service, and the dev servers (web, server) extend it.
name: tandem-dev

services:
  node:
    build:
      # Chromium for the end-to-end tests: its version must match @playwright/test in the
      # catalog (pnpm-workspace.yaml). Rebuild with `./td setup` after upgrading it.
      dockerfile_inline: |
        FROM node:26-slim
        RUN npm install -g pnpm@12.10.1
        ENV PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
        RUN npx -y playwright@1.64.1 install --with-deps chromium
    image: tandem-dev-tools
    pull_policy: never
    init: true
    working_dir: /repo
    environment:
      PNPM_CONFIG_STORE_DIR: /pnpm-store
      # node_modules is also read on the Mac by editor extensions (Oxc, Tailwind CSS).
      PNPM_CONFIG_SUPPORTED_ARCHITECTURES: '{"os":["current","darwin"],"cpu":["current"],"libc":["current"]}'
      TZ: Europe/Paris
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - .:/repo
      - pnpm-store:/pnpm-store
    profiles: [tools]

  # `./td dev`: the API server (with reload) on a development data folder in .data/…
  server:
    extends: node
    profiles: [dev]
    working_dir: /repo/packages/server
    command: node --watch-path=src --watch-path=../shared/src src/main.ts
    environment:
      PORT: 3011
      TANDEM_DATA_DIR: /repo/.data/notes
      TANDEM_DB_PATH: /repo/.data/db/tandem.db
      # Bind mounts on macOS don't always forward file events to Linux.
      TANDEM_WATCH_POLLING: 'true'
      # The web app's dev server and the tools container call it by this name (api/guard.ts).
      TANDEM_ALLOWED_HOSTS: server
    ports:
      - '127.0.0.1:3011:3011'

  # …and the web app's dev server, which forwards /api, /files and /mcp to it.
  web:
    extends: node
    profiles: [dev]
    working_dir: /repo/packages/web
    command: node --run dev
    environment:
      TANDEM_API_URL: http://server:3011
    ports:
      - '127.0.0.1:3010:3010'
    depends_on: [server]

  # …and the website (site/: the landing page alone), on its own dev server.
  site:
    extends: node
    profiles: [dev]
    working_dir: /repo/packages/web
    command: node --run dev:site
    ports:
      - '127.0.0.1:3012:3012'

volumes:
  pnpm-store:
    name: tandem-dev-pnpm-store
